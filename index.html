<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=supreme@500,700&display=swap" rel="stylesheet"> 
</head>
<body>
    <div class="navbar bg-base-100 shadow-sm absolute top-0 z-10">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl" href="./">Home</a>
        </div>
        <div class="flex-none">
            <button class="btn btn-square btn-ghost">
                <a href="https://troop49atx.square.site/" class="mr-8">Dontate</a>
            </button>
        </div>
    </div>

    <div class="relative text-center font-[supreme] font-bold flex h-screen object-center">
        <img src="hero3.jpg" alt="pluh" class="h-[100vh] min-w-screen overflow-x-hidden object-cover">
        <p class="absolute top-[5%] left-[50%] translate-x-[-50%] xl:text-9xl lg:text-8xl md:text-7xl text-4xl mt-10">
            TROOP 49
        </p>
        <p class="absolute bottom-[8%] m-0 left-[50%] translate-x-[-50%] w-[90vw] 2xl:text-9xl lg:text-8xl md:text-7xl text-4xl">
            WE DO DANGEROUS THINGS SAFELY.
        </p>
    </div>
    <div class="flex items-center flex-col justify-center text-center text-6xl m-[3vh] font-[supreme] font-bold">
        <a href="https://calendar.google.com/calendar/u/0?cid=YXVzdGludHJvb3A0OUBnbWFpbC5jb20" class="w-auto p-3 hover:text-7xl hover:p-1.5">
            CALENDAR
        </a>
        <a onclick="my_modal_2.showModal()" class="w-auto p-3 hover:text-7xl hover:p-1.5 cursor-pointer">
            JOIN US
        </a>
        <dialog id="my_modal_2" class="modal">
            <div class="modal-box font-sans">
                <h3 class="text-lg font-bold">Welcome!</h3>
                <p class="py-4 text-[1rem] font-normal">
                    Join us on any Tuesday night at Fath Lutheran Church!<br>
                    6600 Woodrow Ave, Austin, TX 78757; Tuesdays 7:00 PM
                </p>
                <div class="modal-action">
                    <form method="dialog">
                        <!-- if there is a button in form, it will close the modal -->
                        <button class="btn">Close</button>
                    </form>
                </div>
            </div>
        </dialog>
        <a href="./service" class="text-p w-auto p-3 hover:text-7xl hover:p-1.5">
            SERVICE PROJECTS
        </a>
        <a href="./gallery" class="w-auto p-3 hover:text-7xl hover:p-1.5">
            GALLERY
        </a>
        <a href="./aboutus" class="w-auto p-3 hover:text-7xl hover:p-1.5">
            ABOUT US
        </a>
    </div>
</body>
</html>
